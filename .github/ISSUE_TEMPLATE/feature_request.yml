name: Feature request
description: Suggest something Jarod-OS should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The task or situation, in your own words. What gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you picture it working. Sketches and examples are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
