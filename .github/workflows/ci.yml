name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Fetch the pinned Hermes Agent snapshot
        run: npm run sync-upstream
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  lint:
    name: Lint (Biome)
    # Shell, client and core in one pass; the recommended rules fail the job, the debt that predates the
    # linter is reported as warnings (biome.json) until it is paid down.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint

  kernel:
    name: Kernel (${{ matrix.os }})
    # The core (`jarod-core`) is its own pnpm workspace: the shell's `npm ci` does not install it and
    # `npm test` at the root does not reach it, so none of its tests ran in CI. It needs pnpm, and its
    # package scripts are called by name from the root (`test:core`, `typecheck:core`).
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: jarod-core/pnpm-lock.yaml
      - name: Install the core's workspace
        run: pnpm install --frozen-lockfile
        working-directory: jarod-core
      - run: npm run typecheck:core
      - run: npm run test:core

  bridge:
    name: Bridge plugin (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install pytest pyyaml
      - name: pytest
        if: runner.os != 'Windows'
        run: HERALD_OS_PYTHON="$(command -v python)" bash scripts/test-bridge.sh
      - name: "pytest (Windows: the plugin's tests; the Linux CLI tests do not apply)"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:HERALD_OS_PYTHON = (Get-Command python).Source
          node scripts/run.mjs test-bridge

  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse every bash and Python script
        run: |
          failed=0
          while IFS= read -r file; do
            case "$(head -n 1 "$file")" in
              '#!'*bash*) bash -n "$file" || failed=1 ;;
              '#!'*python*) python3 -m py_compile "$file" || failed=1 ;;
            esac
          done < <(git ls-files)
          exit "$failed"

  powershell:
    name: PowerShell scripts parse
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse every .ps1
        shell: powershell
        run: |
          $failed = 0
          foreach ($file in Get-ChildItem -Recurse -Filter *.ps1 -Path scripts) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors)
            if ($errors) { $failed = 1; $errors | ForEach-Object { Write-Host "$($file.Name): $($_.Message)" } }
          }
          exit $failed

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: bash scripts/check-secrets.sh
