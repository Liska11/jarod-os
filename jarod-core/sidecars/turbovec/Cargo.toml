[package]
name = "turbovec-sidecar"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Jarod-cordis (Q15) : sidecar stdio autour de turbovec, pour le bench d'adoption et l'adaptateur VectorIndexProvider"

[dependencies]
# Accord B17 (2026-09-28) : turbovec 1.0.0 et ses dépendances, versions figées par Cargo.lock.
turbovec = "=1.0.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
