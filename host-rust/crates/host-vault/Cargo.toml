[package]
name = "host-vault"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
host-control = { version = "0.1.0", path = "../host-control" }
host-storage = { version = "0.1.0", path = "../host-storage" }
serde_json = "1.0.154"
zeroize = "1.9.1"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Security", "Win32_System_Memory"] }

[dev-dependencies]
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync"] }
