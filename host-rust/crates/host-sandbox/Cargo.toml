[package]
name = "host-sandbox"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
host-control = { version = "0.1.0", path = "../host-control" }
host-storage = { version = "0.1.0", path = "../host-storage" }
host-supervisor = { version = "0.1.0", path = "../host-supervisor" }
serde_json = "1.0.154"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Memory", "Win32_System_Environment"] }
